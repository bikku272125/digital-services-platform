<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Gradient Background -->
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  
  <!-- Digital Stacked Layers Icon -->
  <g filter="url(#shadow)" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Layer -->
    <path d="M32 16L50 25L32 34L14 25L32 16Z" fill="#FFFFFF" fill-opacity="0.9" />
    <!-- Middle Layer -->
    <path d="M14 33L32 42L50 33" fill="none" stroke="#E0E7FF" stroke-width="3.2" />
    <!-- Bottom Layer -->
    <path d="M14 41L32 50L50 41" fill="none" stroke="#C7D2FE" stroke-width="3.2" />
  </g>
  
  <!-- Small Digital Dot Accent -->
  <circle cx="49" cy="17" r="3.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
