name: poster_design_studio
description: "Poster Design Studio mobile app built with Flutter, connected to Digital Services Platform Django REST API."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_fonts: ^6.2.1
  image_picker: ^1.0.8
  path_provider: ^2.1.2
  share_plus: ^9.0.0
  flutter_colorpicker: ^1.1.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
