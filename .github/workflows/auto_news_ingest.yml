name: Auto Ingest Trending News

on:
  schedule:
    # Runs every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  fetch-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Automated News Ingestion
        run: |
          python scraper/fetch_news.py

      - name: Commit Updated Sitemap to Main
        run: |
          git config --global user.name "Aaradhya Automation Bot"
          git config --global user.email "bot@aaradhyaenertech.com"
          git add frontend/public/sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(seo): auto-update dynamic news sitemap [skip ci]" && git push origin main)

